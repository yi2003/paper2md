<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paper2MD{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">📝 Paper2MD</a>
    <span class="tagline">photos of exam papers → markdown</span>
    <nav>
      <a href="/">All tasks</a>
      {% block nav %}{% endblock %}
    </nav>
  </header>

  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/vendor/katex/contrib/auto-render.min.js"></script>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
